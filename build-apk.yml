name: Construir APK Logistica L2

on:
  workflow_dispatch:
  push:
    branches:
      - principal

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: 'false'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0.2'

      - name: Verificar Gradle
        run: gradle --version

      - name: Construir APK
        run: gradle assembleDebug --stacktrace

      - name: Preparar APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Logistica_L2_Android.apk
          ls -lh Logistica_L2_Android.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Logistica-L2-Android-APK
          path: Logistica_L2_Android.apk
          if-no-files-found: error
