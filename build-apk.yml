name: Construir APK Logistica L2
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0'
      - name: Instalar SDK Android
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Construir APK
        run: gradle assembleDebug
      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Logistica_L2_Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Logistica-L2-Android-APK
          path: Logistica_L2_Android.apk
