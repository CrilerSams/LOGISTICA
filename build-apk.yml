name: Construir APK Logistica L2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which sdkmanager
          sdkmanager --version

      - name: Instalar Android 34
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Verificar Gradle
        run: |
          gradle --version

      - name: Construir APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Renombrar APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Logistica_L2_Android.apk
          ls -lh Logistica_L2_Android.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Logistica-L2-Android-APK
          path: Logistica_L2_Android.apk
          if-no-files-found: error
